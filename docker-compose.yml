services:
  opotest:
    build: .
    restart: unless-stopped
    volumes:
      - opotest_data:/data
    networks:
      - demo

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      opotest:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - demo

volumes:
  opotest_data:

networks:
  demo:
